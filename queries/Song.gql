query Song($song: String) {
  all_song(where: { songid: $song }) {
    items {
      title
      song
      songid
      artist
      biography
      cover
      formed
      home_town
      length
      logo
      mp3
      artwork {
        imageConnection {
          edges {
            node {
              url
            }
          }
        }
      }
      presets {
        at
        name
        pc
      }
    }
  }
}
